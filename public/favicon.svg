<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Labradorite Iridescent Gradient -->
    <linearGradient id="labGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1726" />
      <stop offset="35%" stop-color="#143A48" />
      <stop offset="70%" stop-color="#2B8C96" />
      <stop offset="100%" stop-color="#C58A45" />
    </linearGradient>
    <linearGradient id="labGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#205B68" />
      <stop offset="50%" stop-color="#607C83" />
      <stop offset="100%" stop-color="#102A38" />
    </linearGradient>
    <linearGradient id="goldGlint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C58A45" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#4A7C80" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#607C83" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Deep Navy Circle Frame -->
  <rect width="100" height="100" rx="20" fill="#0B1726" />
  
  <!-- Geometric Marquise Mineral Form -->
  <g transform="translate(50, 50) rotate(-35) translate(-50, -50)">
    <!-- Main Marquise Facets -->
    <path d="M 50 15 C 75 35 75 65 50 85 C 25 65 25 35 50 15 Z" fill="url(#labGrad1)" stroke="#3A6B78" stroke-width="0.75" />
    
    <!-- Facet Faceting Lines (Mineral Matrix) -->
    <path d="M 50 15 L 50 85" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <path d="M 50 15 C 65 35 65 65 50 85" fill="none" stroke="url(#labGrad2)" stroke-width="1.25" />
    <path d="M 50 35 L 70 50 L 50 65 L 30 50 Z" fill="url(#goldGlint)" stroke="#C58A45" stroke-opacity="0.4" stroke-width="0.75" />
    <path d="M 35 32 L 65 68" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75" />
    <path d="M 65 32 L 35 68" stroke="#607C83" stroke-opacity="0.4" stroke-width="0.75" />
  </g>
  
  <!-- Subtle 'L' Monogram Geometry Accent -->
  <path d="M 32 30 L 32 70 L 68 70" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M 32 70 L 44 58" fill="none" stroke="#C58A45" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
</svg>